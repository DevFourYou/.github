<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9B5CFF"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .run { animation: run 5s linear infinite; }
    @keyframes run { from { transform: translateX(-500px); } to { transform: translateX(1200px); } }
  </style>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="#30363D" opacity="0.6"/>
  <rect class="run" x="0" y="4" width="500" height="4" rx="2" fill="url(#g)"/>
</svg>
