<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Dev4You">
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="120" y1="295" x2="904" y2="730">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.55" stop-color="#4EA8FF"/>
      <stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7C9BFF"/>
      <stop offset="1" stop-color="#B37BFF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9B5CFF"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.35" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D1117"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
    <g id="emblem">
      <polygon points="350,320 350,405 210,515 350,625 350,710 120,535 120,495"/>
      <polygon points="674,320 674,405 814,515 674,625 674,710 904,535 904,495"/>
      <polygon points="525,295 603,295 450,548 665,548 645,617 380,617 355,575"/>
      <polygon points="535,492 605,380 605,730 535,730"/>
    </g>
  </defs>
  <style>
    .orb-a { animation: driftA 14s ease-in-out infinite alternate; }
    .orb-b { animation: driftB 16s ease-in-out infinite alternate; }
    .halo { animation: pulse 4s ease-in-out infinite; }
    .shine { animation: sweep 6s linear infinite; }
    .tag { opacity: 0; animation: cycle 16s infinite; }
    .t2 { animation-delay: 4s; } .t3 { animation-delay: 8s; } .t4 { animation-delay: 12s; }
    @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(120px,40px); } }
    @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-140px,-30px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
    @keyframes sweep { from { transform: translateX(-1200px); } to { transform: translateX(1200px); } }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 4%,22% { opacity: 1; transform: translateY(0); } 26%,100% { opacity: 0; transform: translateY(-8px); } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0D1117"/>
    <circle class="orb-a" cx="230" cy="120" r="170" fill="#00E5FF" opacity="0.22" filter="url(#blur)"/>
    <circle class="orb-b" cx="1000" cy="260" r="190" fill="#8B5CF6" opacity="0.26" filter="url(#blur)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#fade)"/>

    <g transform="translate(40,-36) scale(0.42)">
      <use href="#emblem" class="halo" fill="url(#brand)" filter="url(#glow)"/>
      <use href="#emblem" fill="url(#brand)"/>
    </g>

    <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
      <text x="470" y="112" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="17" letter-spacing="4" fill="#7D8590">&lt;/&gt; EQUIPO DE ESTUDIO · LIMA, PERÚ</text>
      <text x="464" y="200" font-size="96" font-weight="800" letter-spacing="-2" fill="url(#title)">Dev4You</text>
      <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#E6EDF3">
        <text x="470" y="250"><tspan fill="#00F0FF">❯</tspan></text>
        <text class="tag t1" x="498" y="250">proyectos de carrera en VR, web e IA</text>
        <text class="tag t2" x="498" y="250">aprendiendo juntos a construir software real</text>
        <text class="tag t3" x="498" y="250">Unity · Next.js · Bun · C# · TypeScript</text>
        <text class="tag t4" x="498" y="250">4 estudiantes · Universidad Autónoma del Perú</text>
      </g>
    </g>

    <rect x="0" y="352" width="1200" height="2" fill="#30363D"/>
    <rect class="shine" x="0" y="351" width="600" height="4" fill="url(#line)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="22" fill="none" stroke="#30363D"/>
</svg>
